<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Review a tour itinerary and select package options before booking with The Traveller.">
  <title>Package Details | The Traveller</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>

<body data-page="details">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="navbar-slot"></div>
  <header class="page-hero page-hero--details"><video class="hero-video" src="../assets/videos/kerala.mp4" autoplay loop muted playsinline
      aria-hidden="true"></video>
    <div class="hero-overlay"></div>
    <div class="container page-hero-content" data-aos="fade-up"><span class="eyebrow">PACKAGE DETAILS</span>
      <h1 id="detailHeroTitle">Choose your journey</h1>
      <p id="detailHeroCopy">Review the itinerary, then select dates and traveller details.</p>
    </div>
  </header>
  <main id="main-content">
    <section class="section-padding">
      <div class="container">
        <div class="row g-5">
          <div class="col-lg-7">
            <div id="packageDetailContent"></div>
          </div>
          <div class="col-lg-5">
            <form id="packageSelectionForm" class="booking-card booking-card--sticky sticky-lg-top">
              <h2>Reserve this package</h2>
              <p class="text-muted">No payment is processed in this demo.</p>
              <div class="mb-3"><label for="selectedPackage">Package</label><select id="selectedPackage"
                  name="packageId" class="form-select" required></select></div>
              <div class="row g-3">
                <div class="col-6"><label for="travelStart">Start date</label><input type="date" id="travelStart"
                    name="travelDate" class="form-control" required></div>
                <div class="col-6"><label for="travellerCount">Travellers</label><input type="number"
                    id="travellerCount" name="travellers" class="form-control" min="1" max="20" value="2" required>
                </div>
                <div class="col-12"><label for="roomType">Room preference</label><select id="roomType" name="roomType"
                    class="form-select">
                    <option>Standard</option>
                    <option>Deluxe</option>
                    <option>Premium</option>
                  </select></div>
                <div class="col-12"><label for="leadName">Lead traveller name</label><input id="leadName" name="name"
                    class="form-control" required autocomplete="name"></div>
                <div class="col-md-6"><label for="leadEmail">Email</label><input type="email" id="leadEmail"
                    name="email" class="form-control" required autocomplete="email"></div>
                <div class="col-md-6"><label for="leadPhone">Phone</label><input type="tel" id="leadPhone" name="phone"
                    class="form-control" required autocomplete="tel"></div>
                <div class="col-12"><label for="specialRequests">Special requests</label><textarea id="specialRequests"
                    name="requests" class="form-control" rows="3"></textarea></div>
              </div><button class="btn btn-brand w-100 mt-4" type="submit">Continue to booking summary →</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="footer-slot"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="../js/app.js"></script>
</body>

</html>
